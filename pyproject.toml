[project]
name = "my_project"
requires-python = ">=3.11,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.23",
    "dagster-webserver>=1.13.23,<1.14",
    "duckdb>=1.0.0",
    "fastapi>=0.115.0",
    "joblib>=1.4.0",
    "mlflow>=2.17.0",
    "pandas>=2.2.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.5.0",
    "uvicorn[standard]>=0.30.0",
    "data-contract",
    "feature-engineering",
    "data-validation",
    "model-training",
    "inference",
    "ingestion",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.uv.sources]
data-contract = { path = "shared/data-contract" }
feature-engineering = { path = "services/feature-engineering" }
data-validation = { path = "services/validation" }
model-training = { path = "services/training" }
inference = { path = "services/inference" }
ingestion = { path = "services/ingestion" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "my_project"
code_location_name = "my_project.definitions"
registry_modules = [
    "my_project.components.*",
]


