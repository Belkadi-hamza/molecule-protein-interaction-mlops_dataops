[project]
name = "inference"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115.0", "joblib>=1.4.0", "pydantic>=2.7.0", "uvicorn[standard]>=0.30.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference"]