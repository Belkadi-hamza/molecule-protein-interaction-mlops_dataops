[project]
name = "data-validation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0.0", "data-contract"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validation"]

[tool.uv.sources]
data-contract = { path = "../../shared/data-contract" }