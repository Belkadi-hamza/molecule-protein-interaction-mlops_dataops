[project]
name = "ingestion"
version = "0.1.0"
description = "CSV -> DuckDB ingestion API, orchestrated by Dagster"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "duckdb>=1.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "data-contract",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.uv.sources]
data-contract = { path = "../../shared/data-contract" }
