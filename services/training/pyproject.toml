[project]
name = "model-training"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "joblib>=1.4.0",
    "mlflow>=2.17.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "data-contract",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training"]

[tool.uv.sources]
data-contract = { path = "../../shared/data-contract" }